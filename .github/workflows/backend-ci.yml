name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true

      - name: Restore
        run: dotnet restore AstroTrack.Api/AstroTrack.Api.csproj

      - name: Build
        run: dotnet build AstroTrack.Api/AstroTrack.Api.csproj --configuration Release --no-restore

      - name: Backend tests status
        run: echo "No dedicated backend test project exists yet; dotnet test is intentionally skipped in this workflow. Add backend tests in a follow-up issue."
